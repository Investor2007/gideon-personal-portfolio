<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Official personal portfolio of Gideon Inye Ata-Usen. Explore my profile, education, AI training, skills and professional journey.">

<meta name="author" content="Gideon Inye Ata-Usen">

<meta name="theme-color" content="#102a56">

<title>Gideon Inye Ata-Usen | Personal Portfolio</title>

<style>

/* =========================
   GLOBAL SETTINGS
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

:root {
    --primary: #102a56;
    --secondary: #2463c5;
    --light-blue: #eaf2ff;
    --white: #ffffff;
    --dark: #17243a;
    --gray: #64748b;
    --background: #f7f9fd;
    --border: #e4eaf3;
    --card: #ffffff;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: var(--background);
    color: var(--dark);
    line-height: 1.7;
    transition: background 0.3s, color 0.3s;
}

a {
    text-decoration: none;
}

.container {
    width: 90%;
    max-width: 1150px;
    margin: auto;
}

section {
    padding: 85px 0;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
}

.section-title h2 {
    font-size: 35px;
    color: var(--primary);
    margin-bottom: 10px;
}

.section-title p {
    color: var(--gray);
}

/* =========================
   NAVIGATION
========================= */

header {
    background: var(--white);
    box-shadow: 0 2px 15px rgba(0,0,0,0.05);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.navbar {
    min-height: 75px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    color: var(--primary);
}

.logo span {
    color: var(--secondary);
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 25px;
}

.nav-links a {
    color: var(--dark);
    font-size: 14px;
    font-weight: bold;
    transition: 0.3s;
}

.nav-links a:hover {
    color: var(--secondary);
}

.menu-button {
    display: none;
    border: none;
    background: transparent;
    color: var(--primary);
    font-size: 28px;
    cursor: pointer;
}

/* =========================
   HERO SECTION
========================= */

.hero {
    background: linear-gradient(
        130deg,
        #102a56,
        #17427f,
        #2463c5
    );

    color: white;
    padding: 100px 0;
    overflow: hidden;
}

.hero-content {
    display: grid;
    grid-template-columns: 1.3fr 0.8fr;
    align-items: center;
    gap: 60px;
}

.hero-label {
    color: #b9d5ff;
    font-weight: bold;
    letter-spacing: 3px;
    font-size: 13px;
    text-transform: uppercase;
}

.hero h1 {
    font-size: clamp(40px, 6vw, 65px);
    line-height: 1.15;
    margin: 20px 0;
}

.hero h1 span {
    color: #a9ceff;
}

.hero-description {
    color: #e1ecff;
    font-size: 17px;
    max-width: 550px;
    margin-bottom: 30px;
}

.hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
}

.button {
    display: inline-block;
    padding: 13px 25px;
    border-radius: 30px;
    font-weight: bold;
    transition: 0.3s;
}

.button-primary {
    background: white;
    color: var(--primary);
}

.button-primary:hover {
    background: #dceaff;
    transform: translateY(-3px);
}

.button-outline {
    border: 2px solid white;
    color: white;
}

.button-outline:hover {
    background: white;
    color: var(--primary);
}

.profile-image {
    width: 300px;
    height: 360px;
    margin: auto;
    border: 8px solid rgba(255,255,255,0.2);
    border-radius: 25px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
}

.profile-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 28%;
    display: block;
}

/* =========================
   ABOUT SECTION
========================= */

.about-grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 30px;
}

.card {
    background: var(--card);
    padding: 30px;
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(16,42,86,0.06);
}

.card h3 {
    color: var(--primary);
    margin-bottom: 15px;
    font-size: 21px;
}

.card p {
    color: var(--gray);
}

.personal-details {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.detail-item {
    display: flex;
    gap: 15px;
    align-items: center;
}

.detail-icon {
    width: 45px;
    height: 45px;
    background: var(--light-blue);
    color: var(--secondary);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
}

.detail-item strong {
    display: block;
    color: var(--primary);
}

.detail-item p,
.detail-item a {
    color: var(--gray);
    overflow-wrap: anywhere;
}

/* =========================
   EDUCATION SECTION
========================= */

.education {
    background: white;
}

.education-card {
    max-width: 850px;
    margin: auto;
    border-left: 5px solid var(--secondary);
}

.status {
    display: inline-block;
    background: #e3f8ec;
    color: #167a42;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    margin-top: 15px;
}

/* =========================
   SKILLS SECTION
========================= */

.skills-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
}

.skill-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 30px;
    border-radius: 18px;
    transition: 0.3s;
}

.skill-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 15px 35px rgba(16,42,86,0.1);
}

.skill-card h3 {
    color: var(--primary);
    margin-bottom: 10px;
}

.skill-card p {
    color: var(--gray);
}

/* =========================
   CERTIFICATES SECTION
========================= */

.certificates {
    background: white;
}

.certificate-box {
    max-width: 850px;
    margin: auto;
    padding: 30px;
    text-align: center;
    border: 2px dashed #b8c9e2;
    border-radius: 18px;
    background: #f8fbff;
}

.certificate-box h3 {
    color: var(--primary);
    margin-bottom: 10px;
}

.certificate-box p {
    color: var(--gray);
}

/* =========================
   CONTACT SECTION
========================= */

.contact {
    background: #edf4ff;
}

.contact-box {
    background: var(--primary);
    color: white;
    padding: 55px 35px;
    text-align: center;
    border-radius: 25px;
}

.contact-box h2 {
    font-size: 35px;
    margin-bottom: 15px;
}

.contact-box p {
    color: #dceaff;
    margin-bottom: 25px;
}

.contact-box .button {
    background: white;
    color: var(--primary);
}

.contact-box .button:hover {
    background: #dceaff;
}

/* =========================
   FOOTER
========================= */

footer {
    background: #091c3b;
    color: white;
    padding: 30px 0;
    text-align: center;
}

footer p {
    color: #c6d6ee;
    font-size: 14px;
}

   DARK MODE
========================= */
